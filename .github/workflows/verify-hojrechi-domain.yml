name: Hojrechi TWA domain verification
on:
  push:
    branches:
      - hojrechi-twa-v1.5
    paths:
      - .github/workflows/verify-hojrechi-domain.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact well-known files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 25 --retry 2 -H 'Accept: application/json' -D assetheaders.txt -o assetlinks.json 'https://hojrechi.com/.well-known/assetlinks.json'
          curl -fsSL --max-time 25 --retry 2 -H 'Accept: application/manifest+json,application/json' -D manifestheaders.txt -o manifest.webmanifest 'https://hojrechi.com/manifest.webmanifest'
          echo "assetlinks HTTP:"
          head -n 1 assetheaders.txt
          echo "manifest HTTP:"
          head -n 1 manifestheaders.txt
          echo "assetlinks Content-Type:"
          grep -i '^content-type:' assetheaders.txt | tail -n 1 || true
          echo "manifest Content-Type:"
          grep -i '^content-type:' manifestheaders.txt | tail -n 1 || true
      - name: Diagnose TLS, DNS and requests across HTTP/2, HTTP/1.1, IPv4/IPv6
        shell: bash
        run: |
          set +e
          echo "DNS A and AAAA (record presence)"
          getent ahostsv4 hojrechi.com | head -n 4 || true
          getent ahostsv6 hojrechi.com | head -n 4 || true
          URL="https://hojrechi.com/.well-known/assetlinks.json"
          for mode in http11 http2 head chrome bazaar ipv6; do
            echo "== request: ${mode} =="
            flags="-4 --http1.1"
            if [ "${mode}" = http2 ]; then flags="-4 --http2"; fi
            if [ "${mode}" = head ]; then flags="-4 --head"; fi
            if [ "${mode}" = ipv6 ]; then flags="-6 --http2"; fi
            if [ "${mode}" = chrome ]; then flags="-4 --http2 -A Mozilla/5.0"; fi
            if [ "${mode}" = bazaar ]; then flags="-4 --http1.1 -A python-requests/2.31.0"; fi
            curl ${flags} -sS -L --max-time 15 --connect-timeout 7 -D "headers-${mode}.txt" -o "body-${mode}.txt" -w "result http=%{http_code} ip=%{remote_ip} tls=%{ssl_verify_result} redirects=%{num_redirects} mime=%{content_type} bytes=%{size_download} err=%{errormsg}\n" "${URL}" || true
            head -n 14 "headers-${mode}.txt" 2>/dev/null || true
            wc -c "body-${mode}.txt" 2>/dev/null || true
          done
          echo "== Certificate chain =="
          echo | timeout 12 openssl s_client -connect hojrechi.com:443 -servername hojrechi.com -verify_return_error 2>&1 | grep -E 'depth=|verify return|Verify return code:|Verification error:|subject=|issuer=' || true
      - name: Validate Digital Asset Links and manifest values
        run: |
          python3 - <<'PY'
          import json, pathlib
          expected="5E:03:4F:EA:96:CC:B0:8B:8E:F3:2B:25:5C:75:AE:CE:49:F4:AB:D3:89:53:46:5E:EA:2F:F1:5E:EE:BC:20:B8"
          raw_asset=pathlib.Path('assetlinks.json').read_bytes()
          raw_manifest=pathlib.Path('manifest.webmanifest').read_bytes()
          print('assetlinks len=',len(raw_asset),'first_bytes=',repr(raw_asset[:400]),flush=True)
          print('manifest len=',len(raw_manifest),'first_bytes=',repr(raw_manifest[:400]),flush=True)
          data=json.loads(raw_asset.decode('utf-8'))
          assert isinstance(data,list), type(data)
          assert any(
              isinstance(item,dict)
              and "delegate_permission/common.handle_all_urls" in item.get('relation',[])
              and item.get('target',{}).get('namespace')=="android_app"
              and item.get('target',{}).get('package_name')=="com.hojrechi.app"
              and expected in item.get('target',{}).get('sha256_cert_fingerprints',[])
              for item in data
          ),'Missing exact production app fingerprint / relation'
          bazaar = [
            item for item in data
            if isinstance(item,dict) and item.get('target',{}).get('namespace')=='cafebazaar_twa'
            and item.get('target',{}).get('package_name')=='com.hojrechi.app'
          ]
          assert bazaar, 'No cafebazaar_twa namespace for com.hojrechi.app in publicly-served JSON'
          for item in bazaar:
            print('Bazaar relations visible from external HTTPS:',item.get('relation'),flush=True)
          assert any(item.get('relation') == ['check_validation'] for item in bazaar), 'Bazaar requires exactly relation [check_validation] in cafebazaar_twa namespace'
          m=json.loads(pathlib.Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert isinstance(m,dict)
          assert m.get('name'), 'Missing PWA name'
          assert m.get('start_url'), 'Missing start_url'
          assert m.get('icons'), 'Missing icons'
          print('PASS: Live Digital Asset Links JSON, release signing certificate SHA-256 and PWA manifest.')
          print('name=',m.get('name'), 'start_url=',m.get('start_url'), 'scope=',m.get('scope'), 'icons=',len(m['icons']))
          PY
