name: Build Hojrechi Android APK
on:
  push:
    branches:
      - hojrechi-android-build
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hojrechi-android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create user-provided splash and icon
        run: |
          python3 -m pip install --quiet Pillow cairosvg
          mkdir -p app/src/main/assets app/src/main/res/drawable
          base64 -d branding/icon.b64 > /tmp/hojrechi-icon.jpg
          python3 - <<'PY'
          from PIL import Image
          from io import BytesIO
          from collections import deque
          import cairosvg
          # Build a crisp 1080x2400 splash from the original brand symbol/wordmark.
          # The SVG contours are traced from the supplied image, rather than a
          # low-resolution screenshot. Keep proportions and prevent CENTER_CROP zoom.
          data=cairosvg.svg2png(url='branding/hojrechi_logo.svg',
                                output_width=1122,output_height=1100)
          logo=Image.open(BytesIO(data)).convert('RGBA')
          splash=Image.new('RGBA',(1080,2400),(249,91,0,255))
          logo=logo.resize((560,550),Image.Resampling.LANCZOS)
          splash.alpha_composite(logo,((1080-560)//2,(2400-550)//2))
          splash.convert('RGB').save('app/src/main/assets/splash_portrait.png',optimize=True)
          im=Image.open('/tmp/hojrechi-icon.jpg').convert('RGBA')
          # Preserve the brand artwork, eliminating only connected white corner pixels.
          pix=im.load(); w,h=im.size
          q=deque([(0,0),(w-1,0),(0,h-1),(w-1,h-1)])
          seen=set()
          while q:
              x,y=q.popleft()
              if not (0<=x<w and 0<=y<h) or (x,y) in seen: continue
              seen.add((x,y))
              r,g,b,a=pix[x,y]
              if r<235 or g<235 or b<235: continue
              pix[x,y]=(r,g,b,0)
              q.extend([(x+1,y),(x-1,y),(x,y+1),(x,y-1)])
          im.resize((512,512),Image.Resampling.LANCZOS).save('app/src/main/res/drawable/app_icon.png')
          PY
          test -s app/src/main/assets/splash_portrait.png
          test -s app/src/main/res/drawable/app_icon.png
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK certificate, package and splash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 5
          python3 - <<'PY'
          import zipfile
          from io import BytesIO
          from PIL import Image
          apk='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert z.getinfo('classes2.dex').file_size > 10000
              splash=Image.open(BytesIO(z.read('assets/splash_portrait.png')))
              assert splash.size == (1080,2400),splash.size
              assert z.getinfo('res/drawable/app_icon.png').file_size > 1000
              print('Verified: signed APK, splash 1080x2400, bundled icon, code dex')
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Hojrechi-Android-1.3.1-APK
          path: hojrechi-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  smoke-test:
    name: Android 13 emulator - launch and crash check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled APK
        uses: actions/download-artifact@v4
        with:
          name: Hojrechi-Android-1.3.1-APK
          path: tested-apk
      - name: Enable KVM for emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Boot Android 13 and validate launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash hojrechi-android/ci/emulator-smoke-test.sh
      - name: Upload emulator screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hojrechi-Android-13-Emulator-Test
          path: |
            hojrechi-test.png
            android-crash.log
            android-system.log
          if-no-files-found: ignore
          retention-days: 7
